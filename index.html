          var rightAlign = v2.indexOf('') !== -1;
          return '<td' + (rightAlign ? ' style="text-align:right;"' : '') + '>' + v2 + '</td>';
        }
        $('tbody').append('<tr>'+
          cell(data[i][0]) +
          cell(data[i][1]) +
          cell(data[i][2]) +
          cell(data[i][3]) +
          cell(data[i][4]) +
          ((data[i][5]).includes('html') ? '<td><a href="'+data[i][5]+'">'+data[i][5]+'</a></td>' :'<td>'+ data[i][5] +'</td>') +
          cell(data[i][7]) +
        '</tr>')
      }
    }

  });




</script>
