<!DOCTYPE html>
<html lang="ko">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="format-detection" content="telephone=no"/>
<title>열린재정</title>

<link type="text/css" rel="stylesheet" href="../js/jquery-ui/jquery-ui.css">
<link type="text/css" rel="stylesheet" href="../js/swiper10.3.1/swiper-bundle.min.css">
<link type="text/css" rel="stylesheet" href="../css/style.css">
<script src="../js/jquery-1.12.4.min.js"></script>
<script src="../js/jquery-ui/jquery-ui.min.js"></script>
<script src="../js/swiper10.3.1/swiper-bundle.min.js"></script>
<script src="../js/pub-ui.js"></script>

</head>
<body>

    <dl class="skipLink">
        <dt>바로가기 메뉴</dt>
        <dd><a href="#gnbMenu">주메뉴 바로가기</a></dd>
        <dd><a href="#content">본문 바로가기</a></dd>
    </dl>
    <div class="wrap">
        <script id="header-template">
            // 헤더
            $.ajax({url:"common/header.txt", dataType:"text", success:function(data){
                $('#header-template').replaceWith(data);
            }});
        </script>

        <div class="container" id="content">
            <script id="subvisual-template">
                $.ajax({url:"common/subvisual.txt", dataType:"text", success:function(data){
                    $('#subvisual-template').replaceWith($(data).filter('#visual-lab'));
                }});
            </script>

            <script id="breadcrumb-template">
                // breadcrumb메뉴
                $.ajax({url:"common/breadcrumb.txt", dataType:"text", success:function(data){
                    $('#breadcrumb-template').replaceWith(data);
                    breadcrumbMenu();
                }});
            </script>

            <div class="contents">
                <div class="title-main-wrap">
                    <h2 class="title-main">재정데이터 가공요청</h2>
                </div>

                <form class="write-form">
                    <div class="title-section-wrap">
                        <h3 class="title-section">신청서 작성</h3>
                        <div class="right">
                            <p class="txt-required"><span class="ico-required"><span class="sr-only">(필수)</span></span> 필수 입력 항목입니다.</p>
                        </div>
                    </div>

                    <div class="data-detail regist-form-table st2">
                        <table>
                            <caption class="sr-only">재정데이터 가공요청 신청서 작성</caption>
                            <colgroup>
                                <col style="width:210px">
                                <col>
                            </colgroup>
                            <tbody>
                                <tr>
                                    <th scope="row"><label for="dataRequestTitle" class="required">제목 <span class="ico-required"><span class="sr-only">(필수)</span></span></label></th>
                                    <td><input type="text" id="dataRequestTitle" placeholder="제목을 입력해주세요. (한글 20자 이내)" required style="width:100%;"></td>
                                </tr>
                                <tr>
                                    <th scope="row"><label for="dataRequestWriter" class="required">작성자 <span class="ico-required"><span class="sr-only">(필수)</span></span></label></th>
                                    <td><input type="text" id="dataRequestWriter" value="홍길동" required style="width:100%;"></td>
                                </tr>
                                <tr>
                                    <th scope="row"><span class="required">이메일 주소 <span class="ico-required"><span class="sr-only">(필수)</span></span></span></th>
                                    <td>
                                        <div class="input-email">
                                            <input type="text" id="dataRequestEmailId" placeholder="이메일 아이디" aria-label="이메일 아이디" required>
                                            <span class="at">@</span>
                                            <input type="text" id="dataRequestEmailDomain" placeholder="이메일 형식 입력" aria-label="이메일 도메인" required>
                                            <select id="dataRequestEmailSelect" aria-label="이메일 도메인 선택">
                                                <option value="" selected>직접입력</option>
                                                <option value="naver.com">naver.com</option>
                                                <option value="gmail.com">gmail.com</option>
                                                <option value="daum.net">daum.net</option>
                                            </select>
                                        </div>
                                    </td>
                                </tr>
                                <tr class="row-textarea">
                                    <th scope="row"><label for="dataRequestContent" class="required">요청 내용 <span class="ico-required"><span class="sr-only">(필수)</span></span></label></th>
                                    <td>
                                        <textarea id="dataRequestContent" maxlength="400" placeholder="내용을 입력해주세요. (한글 최대 400자 이내)" required></textarea>
                                        <div class="text-count"><em>0</em><span>/400</span></div>
                                    </td>
                                </tr>
                                <tr>
                                    <th scope="row">첨부파일</th>
                                    <td>
                                        <div class="input-upload">
                                            <div class="upload-field">
                                                <div class="inp">
                                                    <label for="dataRequestUploadName" class="sr-only">첨부파일명</label>
                                                    <input type="text" id="dataRequestUploadName" class="upload-name" placeholder="첨부파일 용량은 최대 10MB 입니다." readonly>
                                                </div>
                                                <button type="button" class="btn-nm btn-white btn-file-find">파일찾기</button>
                                                <button type="button" class="btn-nm btn-white btn-file-del">파일삭제</button>
                                            </div>
                                            <div class="upload-file-list"></div>
                                            <input type="file" id="dataRequestUploadFile" class="upload-file" aria-label="첨부파일 선택" tabindex="-1">
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="privacy-agree">
                        <div class="input-choice">
                            <input type="checkbox" id="dataRequestPrivacyAgree" required>
                            <label for="dataRequestPrivacyAgree">개인정보 수집·이용에 동의합니다.<em>(필수)</em></label>
                        </div>
                        <a href="javascript:void(0);" target="_blank" class="btn-link-terms">약관보기</a>
                    </div>
                    

                    <div class="btn-bottom-wrap">
                        <a href="javascript:void(0);" class="btn-nm st-dark">목록</a>
                        <div class="right">
                            <button type="submit" class="btn-nm st-blue">신청하기</button>
                        </div>
                    </div>
                    <p class="txt-submit-note">※ 제출 완료후에는 수정할 수 없습니다. 최종 확인 후 제출해주세요.</p>
                </form>

                <script id="feedback-template">
                    // 피드백
                    $.ajax({url:"common/feedback.txt", dataType:"text", success:function(data){
                        $('#feedback-template').replaceWith(data);
                        pageFeedback();
                    }});
                </script>
            </div>
            <!-- //contents -->

            <script id="floating-template">
                // 플로팅메뉴
                $.ajax({url:"common/floating.txt", dataType:"text", success:function(data){
                    $('#floating-template').replaceWith(data);
                }});
            </script>
        </div>
        <script id="footer-template">
            // 푸터
            $.ajax({url:"common/footer.txt", dataType:"text", success:function(data){
                $('#footer-template').replaceWith(data);
            }});
        </script>
    </div>
    <!-- // wrap -->


<script>
    $('#dataRequestContent').on('input', function(){
        $(this).closest('td').find('.text-count em').text(this.value.length);
    });
</script>

</body>
</html>
