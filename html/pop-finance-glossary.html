
<!DOCTYPE html>
<html lang="ko">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="format-detection" content="telephone=no"/>
<title>열린재정</title>

<link type="text/css" rel="stylesheet" href="../js/jquery-ui/jquery-ui.css">
<link type="text/css" rel="stylesheet" href="../js/swiper10.3.1/swiper-bundle.min.css">
<link type="text/css" rel="stylesheet" href="../css/style.css">
<script src="../js/jquery-1.12.4.min.js"></script>
<script src="../js/jquery-ui/jquery-ui.min.js"></script>
<script src="../js/swiper10.3.1/swiper-bundle.min.js"></script>
<script src="../js/pub-ui.js"></script>

</head>
<body>



<div class="popup-wrap" id="tempPopId">
  <div class="dim"></div>
  <div class="pop-wrap">
    <div class="popup">
      <div class="pop-header">
        <div class="left">
          <h2 class="title">재정 용어사전</h2>
          <div class="tooltip-wrap">
            <button type="button" class="tooltip-btn" aria-label="도움말 보기" aria-expanded="false" aria-controls="tooltip-mymenu">
                <img src="../images/common/ico-tooltip-info.svg" alt="">
            </button>
            <div class="tooltip" id="tooltip-mymenu" role="tooltip">
                <p class="tooltip-text">AI 기반으로 생성된 용어설명으로, 참고용으로만 활용해주시기 바랍니다.</p>
                <button type="button" class="tooltip-close" aria-label="툴팁 닫기">
                    <img src="../images/common/ico-tooltip-close.svg" alt="">
                </button>
            </div>
        </div>
        </div>
        <div class="right">
          <button type="button" class="btn-close"><i class="ico-close"></i></button>
        </div>
      </div>
      <div class="pop-body">
        <!--  검색어 + 결과내 재검색 -->
        <div class="form-search-box row-type st-sm">
          <div class="form-search-fields">
            <div class="fm auto">
              <div class="inp auto">
                <input type="text" id="bar-keyword" placeholder="검색어를 입력하세요." aria-label="검색어">
              </div>
              <button type="button" class="btn-search">검색</button>
            </div>
            <div class="input-choice mo-oneline">
              <input type="checkbox" id="bar-research">
              <label for="bar-research">결과내 재검색</label>
            </div>
            <button type="button" class="btn-filter-close btn-nm btn-white">
              <span>상세 검색</span>
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M16.4452 7.0051C16.7189 7.25139 16.7411 7.67292 16.4948 7.94661L10.4955 14.6133C10.3691 14.7538 10.1889 14.834 9.99994 14.834C9.81095 14.834 9.63083 14.7538 9.50439 14.6133L3.50439 7.94663C3.25809 7.67296 3.28027 7.25143 3.55395 7.00513C3.82762 6.75882 4.24915 6.78101 4.49545 7.05468L9.9999 13.1707L15.5037 7.05471C15.75 6.78102 16.1715 6.75881 16.4452 7.0051Z" fill="#33363D"/>
              </svg>
                
            </button>
          </div>
        </div>


        <!-- 자음 · 알파벳 인덱스 -->
        <div class="glossary-index" id="detailFilter" style="display:none;">
          <div class="glossary-index-row">
            <span class="glossary-index-label">가나다</span>
            <div class="glossary-index-btns">
              <button type="button" class="glossary-index-btn">가</button>
              <button type="button" class="glossary-index-btn">나</button>
              <button type="button" class="glossary-index-btn">다</button>
              <button type="button" class="glossary-index-btn">라</button>
              <button type="button" class="glossary-index-btn">마</button>
              <button type="button" class="glossary-index-btn">바</button>
              <button type="button" class="glossary-index-btn">사</button>
              <button type="button" class="glossary-index-btn">아</button>
              <button type="button" class="glossary-index-btn">자</button>
              <button type="button" class="glossary-index-btn">차</button>
              <button type="button" class="glossary-index-btn">카</button>
              <button type="button" class="glossary-index-btn">타</button>
              <button type="button" class="glossary-index-btn">파</button>
              <button type="button" class="glossary-index-btn">하</button>
              <button type="button" class="glossary-index-btn st-wide">숫자·기타</button>
            </div>
          </div>
          <div class="glossary-index-row">
            <span class="glossary-index-label">알파벳</span>
            <div class="glossary-index-btns">
              <button type="button" class="glossary-index-btn">A</button>
              <button type="button" class="glossary-index-btn">B</button>
              <button type="button" class="glossary-index-btn">C</button>
              <button type="button" class="glossary-index-btn">D</button>
              <button type="button" class="glossary-index-btn">E</button>
              <button type="button" class="glossary-index-btn">F</button>
              <button type="button" class="glossary-index-btn">G</button>
              <button type="button" class="glossary-index-btn">H</button>
              <button type="button" class="glossary-index-btn">I</button>
              <button type="button" class="glossary-index-btn">J</button>
              <button type="button" class="glossary-index-btn">K</button>
              <button type="button" class="glossary-index-btn">L</button>
              <button type="button" class="glossary-index-btn">M</button>
              <button type="button" class="glossary-index-btn">N</button>
              <button type="button" class="glossary-index-btn">O</button>
              <button type="button" class="glossary-index-btn">P</button>
              <button type="button" class="glossary-index-btn">Q</button>
              <button type="button" class="glossary-index-btn">R</button>
              <button type="button" class="glossary-index-btn">S</button>
              <button type="button" class="glossary-index-btn">T</button>
              <button type="button" class="glossary-index-btn">U</button>
              <button type="button" class="glossary-index-btn">V</button>
              <button type="button" class="glossary-index-btn">W</button>
              <button type="button" class="glossary-index-btn">X</button>
              <button type="button" class="glossary-index-btn">Y</button>
              <button type="button" class="glossary-index-btn">Z</button>
            </div>
          </div>
        </div>

        <div class="data-util">
          <div class="left">
            <div class="total">전체 <em>85,007</em>건</div>
          </div>
        </div>

        <div class="data-default" style="height: 300px;background: #dedede;display:flex;justify-content:center;align-items:center;font-size:30px;">테이블영역</div>
      </div>
    </div>
  </div>
</div>



<script>
  popOpen('#tempPopId');


  var $detailFilter = $('#detailFilter');
  var $filterBtn = $('.btn-filter-close');

  $filterBtn.on('click', function(){
    var $btn = $(this);
    $btn.toggleClass('on');
    $detailFilter.toggle();
  });

  $('.btn-detail-filter-close').on('click', function(){
    $detailFilter.hide();
  });

  /* 자음 · 알파벳 인덱스 선택 */
  $(document).on('click', '.glossary-index-btn', function(){
    var $btn = $(this);
    $btn.closest('.glossary-index').find('.glossary-index-btn').removeClass('on').attr('aria-pressed', 'false');
    $btn.addClass('on').attr('aria-pressed', 'true');
  });

</script>

</body>
</html>
