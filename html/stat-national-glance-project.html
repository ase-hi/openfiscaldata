<!DOCTYPE html>
<html lang="ko">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="format-detection" content="telephone=no"/>
<title>열린재정</title>

<link type="text/css" rel="stylesheet" href="../js/jquery-ui/jquery-ui.css">
<link type="text/css" rel="stylesheet" href="../js/swiper10.3.1/swiper-bundle.min.css">
<link type="text/css" rel="stylesheet" href="../css/style.css">
<script src="../js/jquery-1.12.4.min.js"></script>
<script src="../js/jquery-ui/jquery-ui.min.js"></script>
<script src="../js/swiper10.3.1/swiper-bundle.min.js"></script>
<script src="../js/pub-ui.js"></script>

</head>
<body>

    <dl class="skipLink">
        <dt>바로가기 메뉴</dt>
        <dd><a href="#gnbMenu">주메뉴 바로가기</a></dd>
        <dd><a href="#content">본문 바로가기</a></dd>
    </dl>
    <div class="wrap">
        <script id="header-template">
            // 헤더
            $.ajax({url:"common/header.txt", dataType:"text", success:function(data){
                $('#header-template').replaceWith(data);
            }});
        </script>

        <div class="container" id="content">
            <script id="subvisual-template">
                $.ajax({url:"common/subvisual.txt", dataType:"text", success:function(data){
                    $('#subvisual-template').replaceWith($(data).filter('#visual-statistics'));
                }});
            </script>

            <script id="breadcrumb-template">
                // breadcrumb메뉴
                $.ajax({url:"common/breadcrumb.txt", dataType:"text", success:function(data){
                    $('#breadcrumb-template').replaceWith(data);
                    breadcrumbMenu();
                }});
            </script>

            <div class="contents">
                <div class="finance-stat-wrap stat-national-wrap glance-wrap">
                    <div class="title-main-wrap">
                        <h2 class="title-main">3대 재정 한눈에 보기</h2>
                        <div class="right">
                            <div class="glance-year">
                                <label for="glanceYear" class="glance-year-label">회계연도</label>
                                <div class="sel"><select id="glanceYear" name="year"><option selected>2026</option><option>2025</option><option>2024</option></select></div>
                            </div>
                        </div>
                    </div>

                    <!-- 안내 박스 -->
                    <div class="cont-box st2">
                        <p><b>중앙재정·지방재정·지방교육재정 3대 재정</b>을 한 화면에서 한눈에 비교하는 대시보드입니다.</p>
                    </div>

                    <!-- 3대 재정 한눈에 보기 탭 (메뉴 페이지 이동) -->
                    <div class="tab-main">
                        <ul>
                            <li><a href="stat-national-glance-integrated.html">통합재정</a></li>
                            <li><a href="stat-national-glance-revenue.html">총세입예산</a></li>
                            <li><a href="stat-national-glance-expenditure.html">총세출예산</a></li>
                            <li><a href="stat-national-glance-soundness.html">재정건전성</a></li>
                            <li><a href="stat-national-glance-local-transfer.html">지방재정이전</a></li>
                            <li class="on"><a href="stat-national-glance-project.html" aria-current="page">세부사업별 재정통계</a></li>
                        </ul>
                    </div>

                    <div class="tab-content">
                        <!-- 검색 : 연월 + 텍스트 + 텍스트 + 검색어 (한줄형) -->
                        <form class="form-search-box st-search-options centered st-gap-sm" onsubmit="return false;">
                            <div class="form-search-fields">
                                <div class="fm">
                                    <label for="projectMonth" class="label">2026년</label>
                                    <div class="sel st-auto"><select id="projectMonth" name="month"><option>1월</option><option>2월</option><option>3월</option><option>4월</option><option>5월</option><option>6월</option><option>7월</option><option>8월</option><option>9월</option><option>10월</option><option>11월</option><option selected>12월</option></select></div>
                                </div>
                                <div class="fm">
                                    <label for="projectType1" class="label">부문</label>
                                    <div class="sel st-minw"><select id="projectType1" name="type1"><option value="" selected>선택</option></select></div>
                                </div>
                                <div class="fm">
                                    <label for="projectType2" class="label">구분</label>
                                    <div class="sel st-minw"><select id="projectType2" name="type2"><option value="" selected>선택</option></select></div>
                                </div>
                                <div class="fm st-grow">
                                    <label for="projectKeyword" class="sr-only">검색어</label>
                                    <div class="inp"><input type="text" id="projectKeyword" name="keyword" placeholder="내용을 입력하세요"></div>
                                </div>
                                <button type="submit" class="btn-search">검색</button>
                            </div>
                        </form>

                        <!-- 건수 + 단위 + 엑셀 -->
                        <div class="data-util">
                            <div class="left">
                                <div class="total">총 <em>14,533</em>건</div>
                                <span class="data-unit">(단위 : 백만원)</span>
                            </div>
                            <div class="right">
                                <button type="button" class="btn-sm btn-white btn-excel">
                                    <i class="ico-excel" aria-hidden="true"></i>
                                    <span>엑셀 다운로드</span>
                                </button>
                            </div>
                        </div>
                        <div class="data-default" style="height: 500px;background: #dedede;display:flex;justify-content:center;align-items:center;font-size:30px;">테이블영역</div>
                    </div>
                </div>

                <script id="feedback-template">
                    // 피드백
                    $.ajax({url:"common/feedback.txt", dataType:"text", success:function(data){
                        $('#feedback-template').replaceWith(data);
                        pageFeedback();
                    }});
                </script>
            </div>
            <!-- //contents -->

            <script id="floating-template">
                // 플로팅메뉴
                $.ajax({url:"common/floating.txt", dataType:"text", success:function(data){
                    $('#floating-template').replaceWith(data);
                }});
            </script>
        </div>
        <script id="footer-template">
            // 푸터
            $.ajax({url:"common/footer.txt", dataType:"text", success:function(data){
                $('#footer-template').replaceWith(data);
            }});
        </script>
    </div>
    <!-- // wrap -->

</body>
</html>
