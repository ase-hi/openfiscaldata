
<!DOCTYPE html>
<html lang="ko">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="format-detection" content="telephone=no"/>
<title>열린재정</title>

<link type="text/css" rel="stylesheet" href="../js/jquery-ui/jquery-ui.css">
<link type="text/css" rel="stylesheet" href="../js/swiper10.3.1/swiper-bundle.min.css">
<link type="text/css" rel="stylesheet" href="../css/style.css">
<script src="../js/jquery-1.12.4.min.js"></script>
<script src="../js/jquery-ui/jquery-ui.min.js"></script>
<script src="../js/swiper10.3.1/swiper-bundle.min.js"></script>
<script src="../js/pub-ui.js"></script>

</head>
<body>



<div class="popup-wrap" id="tempPopId">
  <div class="dim"></div>
  <div class="pop-wrap">
    <div class="popup" style="width:999px;">
      <div class="pop-header">
        <div class="left">
          <h2 class="title">자료 종류 보기</h2>
        </div>
        <div class="right">
          <button type="button" class="btn-close"><i class="ico-close"><span class="sr-only">닫기</span></i></button>
        </div>
      </div>
      <div class="pop-body">
        <div class="doc-type-select">
          <div class="doc-type-group">
            <div class="title-section-wrap">
              <h3 class="title-section" id="docTypeKind">자료 유형</h3>
            </div>
            <div class="doc-type-chips" role="group" aria-labelledby="docTypeKind">
              <button type="button" class="doc-type-chip" aria-pressed="false">전체 85,007</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">재정보고서 및 문서 7,032</button>
              <button type="button" class="doc-type-chip on" aria-pressed="true">재정간행물 673</button>
            </div>
          </div>
          <div class="doc-type-group">
            <div class="title-section-wrap">
              <h3 class="title-section" id="docTypeSort">종류</h3>
            </div>
            <div class="doc-type-chips" role="group" aria-labelledby="docTypeSort">
              <button type="button" class="doc-type-chip" aria-pressed="false">전체</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">월간재정동향</button>
              <button type="button" class="doc-type-chip on" aria-pressed="true">예산(나라살림)</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">주요재정통계</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">회계·기금운용구조</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">해외재정동향</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">IMF</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">경제동향</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">OECD</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">부담금운용현황</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">기금운용평가결과</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">재정사업자율평가</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">월간나라재정</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">예산안분석</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">알기쉬운 나라살림</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">기타자료</button>
            </div>
          </div>
        </div>
      </div>
      <div class="pop-footer">
        <div class="btn-wrap">
            <button type="button" class="btn-nm btn-blue">적용하기</button>
        </div>
      </div>
    </div>
  </div>
</div>



<script>
  popOpen('#tempPopId');

  // 자료 종류 : 그룹별 단일 선택
  $(document).on('click', '.doc-type-chip', function(){
    var $chip = $(this);
    $chip.closest('.doc-type-chips').find('.doc-type-chip').removeClass('on').attr('aria-pressed', 'false');
    $chip.addClass('on').attr('aria-pressed', 'true');
  });
</script>

</body>
</html>
