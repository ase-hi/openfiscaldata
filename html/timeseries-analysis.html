<!DOCTYPE html>
<html lang="ko">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="format-detection" content="telephone=no"/>
<title>열린재정</title>

<link type="text/css" rel="stylesheet" href="../js/jquery-ui/jquery-ui.css">
<link type="text/css" rel="stylesheet" href="../js/swiper10.3.1/swiper-bundle.min.css">
<link type="text/css" rel="stylesheet" href="../css/style.css">
<link type="text/css" rel="stylesheet" href="../css/plugin.css">
<script src="../js/jquery-1.12.4.min.js"></script>
<script src="../js/jquery-ui/jquery-ui.min.js"></script>
<script src="../js/swiper10.3.1/swiper-bundle.min.js"></script>
<script src="../js/pub-ui.js"></script>

<link rel="stylesheet" href="../js/jstree/style.css">
<script src="../js/jstree/jstree.min.js"></script>
</head>
<body>

    <dl class="skipLink">
        <dt>바로가기 메뉴</dt>
        <dd><a href="#gnbMenu">주메뉴 바로가기</a></dd>
        <dd><a href="#content">본문 바로가기</a></dd>
    </dl>
    <div class="wrap">
        <script id="header-template">
            // 헤더
            $.ajax({url:"common/header.txt", dataType:"text", success:function(data){
                $('#header-template').replaceWith(data);
            }});
        </script>

        <div class="container" id="content">
            <script id="subvisual-template">
                $.ajax({url:"common/subvisual.txt", dataType:"text", success:function(data){
                    $('#subvisual-template').replaceWith($(data).filter('#visual-lab'));
                }});
            </script>

            <script id="breadcrumb-template">
                // breadcrumb메뉴
                $.ajax({url:"common/breadcrumb.txt", dataType:"text", success:function(data){
                    $('#breadcrumb-template').replaceWith(data);
                    breadcrumbMenu();
                }});
            </script>

            <div class="contents">
                <div class="title-main-wrap">
                    <h2 class="title-main">상세재정통계</h2>
                </div>

                <div class="stat-layout">
                    <script id="stat-side-template">
                        // 통계목록 좌측 패널
                        $.ajax({url:"common/stat-side.html", dataType:"text", success:function(data){
                            $('#stat-side-template').replaceWith(data);
                            initStatisticsSide();
                        }});
                    </script>
                    <div class="stat-main">
                        <div class="tab-main tab-closable">
                            <ul role="tablist" aria-label="열린 통계">
                                <li class="on">
                                    <a href="javascript:void(0);" data-tab-id="sample-stat-tab1" role="tab" aria-selected="true"><span>사회복지</span></a>
                                    <button type="button" class="btn-tab-close" aria-label="사회복지 탭 닫기"></button>
                                </li>
                                <li>
                                    <a href="javascript:void(0);" data-tab-id="sample-stat-tab2" role="tab" aria-selected="false"><span>지방교육1</span></a>
                                    <button type="button" class="btn-tab-close" aria-label="지방교육1 탭 닫기"></button>
                                </li>
                                <li>
                                    <a href="javascript:void(0);" data-tab-id="sample-stat-tab3" role="tab" aria-selected="false"><span>지방교육2</span></a>
                                    <button type="button" class="btn-tab-close" aria-label="지방교육2 탭 닫기"></button>
                                </li>
                                <li>
                                    <a href="javascript:void(0);" data-tab-id="sample-stat-tab4" role="tab" aria-selected="false"><span>지방교육3</span></a>
                                    <button type="button" class="btn-tab-close" aria-label="지방교육3 탭 닫기"></button>
                                </li>
                                <li>
                                    <a href="javascript:void(0);" data-tab-id="sample-stat-tab5" role="tab" aria-selected="false"><span>지방교육4</span></a>
                                    <button type="button" class="btn-tab-close" aria-label="지방교육4 탭 닫기"></button>
                                </li>
                            </ul>
                            <button type="button" class="btn-tab-expand" aria-label="통계 화면 확대"></button>
                        </div>

                        <div class="tab-content">
                            <!-- 분류명 / 항목 선택 -->
                            <div class="ts-select">
                                <div class="ts-select-panels">
                                    <div class="ts-select-panel">
                                        <div class="ts-select-head">
                                            <h4 class="ts-select-tit">분류명</h4>
                                            <div class="right">
                                                <button type="button" class="btn-xsm btn-white">펼침</button>
                                                <button type="button" class="btn-xsm btn-white">닫힘</button>
                                            </div>
                                        </div>
                                        <!-- 트리 영역 -->
                                        <div class="ts-select-body">
                                            <div class="tree_cont" id="statistics_1" aria-label="분류명 선택"></div>
                                        </div>
                                    </div>
                                    <div class="ts-select-panel">
                                        <div class="ts-select-head">
                                            <h4 class="ts-select-tit">항목</h4>
                                            <div class="right">
                                                <button type="button" class="btn-xsm btn-white">펼침</button>
                                                <button type="button" class="btn-xsm btn-white">닫힘</button>
                                            </div>
                                        </div>
                                        <!-- 트리 영역 -->
                                        <div class="ts-select-body"></div>
                                    </div>
                                </div>
                                <div class="ts-select-btns">
                                    <button type="button" class="btn-nm btn-white">추가</button>
                                    <button type="button" class="btn-nm btn-dark">전체 삭제</button>
                                </div>
                            </div>
                            <!-- // 분류명 / 항목 선택 -->

                            <div class="title-secondary-wrap">
                                <h3 class="title-secondary">선택된 시계열 통계</h3>
                            </div>
                            <div class="data-default" style="height: 500px;background: #dedede;display:flex;justify-content:center;align-items:center;font-size:30px;">테이블영역</div>


                            <!-- 재정사업평가결과 검색 -->
                            <div class="form-search-box row-type st-sm">
                                <div class="form-search-fields">
                                    <div class="fm">
                                    <label for="sort-data" class="label">데이터정렬</label>
                                    <div class="sel">
                                        <select id="sort-data" aria-label="데이터정렬">
                                        <option selected>선택</option>
                                        </select>
                                    </div>
                                    </div>
                                    <div class="fm">
                                    <label for="sort-fiscal-year-start" class="label">회계연도</label>
                                    <div class="input-date">
                                        <div class="sel">
                                        <select id="sort-fiscal-year-start" aria-label="회계연도 시작">
                                            <option selected>선택</option>
                                        </select>
                                        </div>
                                        <span class="dash">~</span>
                                        <div class="sel">
                                        <select id="sort-fiscal-year-end" aria-label="회계연도 종료">
                                            <option selected>선택</option>
                                        </select>
                                        </div>
                                    </div>
                                    </div>
                                </div>
                                <div class="form-search-btns">
                                    <button type="button" class="btn-search">검색</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- // stat-main -->
                </div>
                <!-- // stat-layout -->

                <script id="feedback-template">
                    // 피드백
                    $.ajax({url:"common/feedback.txt", dataType:"text", success:function(data){
                        $('#feedback-template').replaceWith(data);
                        pageFeedback();
                    }});
                </script>
            </div>
            <!-- //contents -->

            <script id="floating-template">
                // 플로팅메뉴
                $.ajax({url:"common/floating.txt", dataType:"text", success:function(data){
                    $('#floating-template').replaceWith(data);
                }});
            </script>
        </div>
        <script id="footer-template">
            // 푸터
            $.ajax({url:"common/footer.txt", dataType:"text", success:function(data){
                $('#footer-template').replaceWith(data);
            }});
        </script>
    </div>
    <!-- // wrap -->


<script>
$(function(){
    var $tree = $('#statistics_1');
    $.getJSON('common/statistics-tree-data.json', function(data){
        $tree.jstree({
            core: { data: data, multiple: true, force_text: true },
            checkbox: { three_state: false, cascade: '' },
            plugins: ['checkbox', 'sort'],
            sort: function(a, b){
                return (this.get_node(a).original.otptOrd || 0) - (this.get_node(b).original.otptOrd || 0);
            }
        });
    });
});
</script>
</body>
</html>
