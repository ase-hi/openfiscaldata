<!DOCTYPE html>
<html lang="ko">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="format-detection" content="telephone=no"/>
<title>열린재정</title>

<link type="text/css" rel="stylesheet" href="../js/jquery-ui/jquery-ui.css">
<link type="text/css" rel="stylesheet" href="../js/swiper10.3.1/swiper-bundle.min.css">
<link type="text/css" rel="stylesheet" href="../css/style.css">
<script src="../js/jquery-1.12.4.min.js"></script>
<script src="../js/jquery-ui/jquery-ui.min.js"></script>
<script src="../js/swiper10.3.1/swiper-bundle.min.js"></script>
<script src="../js/pub-ui.js"></script>

</head>
<body>

    <dl class="skipLink">
        <dt>바로가기 메뉴</dt>
        <dd><a href="#gnbMenu">주메뉴 바로가기</a></dd>
        <dd><a href="#content">본문 바로가기</a></dd>
    </dl>
    <div class="wrap">
        <script id="header-template">
            // 헤더
            $.ajax({url:"common/header.txt", dataType:"text", success:function(data){
                $('#header-template').replaceWith(data);
            }});
        </script>

        <div class="container" id="content">
            <script id="subvisual-template">
                $.ajax({url:"common/subvisual.txt", dataType:"text", success:function(data){
                    $('#subvisual-template').replaceWith($(data).filter('#visual-together'));
                }});
            </script>

            <script id="breadcrumb-template">
                // breadcrumb메뉴
                $.ajax({url:"common/breadcrumb.txt", dataType:"text", success:function(data){
                    $('#breadcrumb-template').replaceWith(data);
                    breadcrumbMenu();
                }});
            </script>

            <div class="contents">
                <div class="title-main-wrap">
                    <h2 class="title-main">우수제안사례</h2>
                </div>

                <div class="cont-box st2">
                    <ul class="cont-box-list">
                        <li>국민참여예산제도를 통해 선정된 우수 제안 사례를 소개합니다.</li>
                    </ul>
                </div>

                <form class="form-search-box selects-keyword">
                    <div class="form-search-fields">
                    <div class="form-row">
                        <div class="fm">
                        <label for="caseFiscalYear" class="label">회계연도</label>
                        <div class="sel">
                            <select id="caseFiscalYear" name="fiscalYear">
                            <option selected>2026</option>
                            <option>2025</option>
                            <option>2024</option>
                            </select>
                        </div>
                        </div>
                        <div class="fm">
                        <label for="caseQueryYear" class="label">조회연도</label>
                        <div class="sel">
                            <select id="caseQueryYear" name="queryYear">
                            <option value="" selected>전체</option>
                            <option>2026</option>
                            <option>2025</option>
                            <option>2024</option>
                            </select>
                        </div>
                        </div>
                        <div class="fm">
                        <label for="caseSearchItem" class="label">검색항목</label>
                        <div class="sel">
                            <select id="caseSearchItem" name="searchItem">
                            <option value="" selected>전체</option>
                            </select>
                        </div>
                        </div>
                        <div class="fm">
                        <label for="caseSearchKeyword" class="label">검색어 입력</label>
                        <div class="inp">
                            <input type="text" id="caseSearchKeyword" name="keyword" placeholder="내용을 입력하세요">
                        </div>
                        </div>
                    </div>
                    </div>
                    <div class="form-search-btns">
                    <button type="reset" class="btn-reset">초기화</button>
                    <button type="submit" class="btn-search">검색</button>
                    </div>
                </form>

                <div class="data-util">
                    <div class="left">
                        <div class="total">전체 <em>85,007</em>건</div>
                    </div>
                </div>
                <div class="data-default" style="height: 500px;background: #dedede;display:flex;justify-content:center;align-items:center;font-size:30px;">테이블영역</div>            

                <script id="feedback-template">
                    // 피드백
                    $.ajax({url:"common/feedback.txt", dataType:"text", success:function(data){
                        $('#feedback-template').replaceWith(data);
                        pageFeedback();
                    }});
                </script>
            </div>
            <!-- //contents -->

            <script id="floating-template">
                // 플로팅메뉴
                $.ajax({url:"common/floating.txt", dataType:"text", success:function(data){
                    $('#floating-template').replaceWith(data);
                }});
            </script>
        </div>
        <script id="footer-template">
            // 푸터
            $.ajax({url:"common/footer.txt", dataType:"text", success:function(data){
                $('#footer-template').replaceWith(data);
            }});
        </script>
    </div>
    <!-- // wrap -->

</body>
</html>
