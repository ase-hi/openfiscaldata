
<!DOCTYPE html>
<html lang="ko">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="format-detection" content="telephone=no"/>
<title>열린재정</title>

<link type="text/css" rel="stylesheet" href="../js/jquery-ui/jquery-ui.css">
<link type="text/css" rel="stylesheet" href="../js/swiper10.3.1/swiper-bundle.min.css">
<link type="text/css" rel="stylesheet" href="../css/style.css">
<script src="../js/jquery-1.12.4.min.js"></script>
<script src="../js/jquery-ui/jquery-ui.min.js"></script>
<script src="../js/swiper10.3.1/swiper-bundle.min.js"></script>
<script src="../js/pub-ui.js"></script>

</head>
<body>



<div class="popup-wrap" id="tempPopId">
  <div class="dim"></div>
  <div class="pop-wrap">
    <div class="popup" style="width:999px;">
      <div class="pop-header">
        <div class="left">
          <h2 class="title">자료 종류 보기</h2>
        </div>
        <div class="right">
          <button type="button" class="btn-close"><i class="ico-close"><span class="sr-only">닫기</span></i></button>
        </div>
      </div>
      <div class="pop-body">
        <div class="doc-type-select">
          <div class="doc-type-group">
            <div class="title-section-wrap">
              <h3 class="title-section" id="docTypeField">분야</h3>
            </div>
            <div class="doc-type-chips" role="group" aria-labelledby="docTypeField">
              <button type="button" class="doc-type-chip" aria-pressed="false">전체</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">공공질서 및 안전</button>
              <button type="button" class="doc-type-chip on" aria-pressed="true">과학기술</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">교육</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">교통 및 물류</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">국방</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">국토 및 지역개발</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">농림수산</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">문화 및 관광</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">보건</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">사회복지</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">산업 · 중소기업 및 에너지</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">예비비</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">일반 · 지방행정</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">통신</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">통일 · 외교</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">환경</button>
            </div>
          </div>
          <div class="doc-type-group">
            <div class="title-section-wrap">
              <h3 class="title-section" id="docTypeSector">부문</h3>
            </div>
            <div class="doc-type-chips" role="group" aria-labelledby="docTypeSector">
              <button type="button" class="doc-type-chip on" aria-pressed="true">전체</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">과학기술연구지원</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">기초 · 원천 연구</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">우주 · 항공</button>
              <button type="button" class="doc-type-chip" aria-pressed="false">원자력 · 방사선</button>
            </div>
          </div>
        </div>
      </div>
      <div class="pop-footer">
        <div class="btn-wrap">
            <button type="button" class="btn-nm btn-blue">적용하기</button>
        </div>
      </div>
    </div>
  </div>
</div>



<script>
  popOpen('#tempPopId');

  // 자료 종류 : 그룹별 단일 선택
  $(document).on('click', '.doc-type-chip', function(){
    var $chip = $(this);
    $chip.closest('.doc-type-chips').find('.doc-type-chip').removeClass('on').attr('aria-pressed', 'false');
    $chip.addClass('on').attr('aria-pressed', 'true');
  });
</script>

</body>
</html>
