              </div>
          </header>

          <div class="view-detail-body">
              <p>한 나라의 전체 국민이 받아들인 총소속을 전체 인구수로 나누어 계산한 수치입니다.<br>이 지표는 해당 국가의 거주하는 사람들의 평균적인 소득 수준이 어느 정도인지 가장 잘 나타내 주는 대표적인 기준이 됩니다.</p>
