<!DOCTYPE html>
<html lang="ko">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="format-detection" content="telephone=no"/>
<title>열린재정</title>

<link type="text/css" rel="stylesheet" href="../js/jquery-ui/jquery-ui.css">
<link type="text/css" rel="stylesheet" href="../js/swiper10.3.1/swiper-bundle.min.css">
<link type="text/css" rel="stylesheet" href="../css/style.css">
<script src="../js/jquery-1.12.4.min.js"></script>
<script src="../js/jquery-ui/jquery-ui.min.js"></script>
<script src="../js/swiper10.3.1/swiper-bundle.min.js"></script>
<script src="../js/pub-ui.js"></script>

</head>
<body>

    <dl class="skipLink">
        <dt>바로가기 메뉴</dt>
        <dd><a href="#gnbMenu">주메뉴 바로가기</a></dd>
        <dd><a href="#content">본문 바로가기</a></dd>
    </dl>
    <div class="wrap">
        <script id="header-template">
            // 헤더
            $.ajax({url:"common/header.txt", dataType:"text", success:function(data){
                $('#header-template').replaceWith(data);
            }});
        </script>

        <div class="container" id="content">
            <script id="subvisual-template">
                $.ajax({url:"common/subvisual.txt", dataType:"text", success:function(data){
                    $('#subvisual-template').replaceWith($(data).filter('#visual-finance'));
                }});
            </script>

            <script id="breadcrumb-template">
                // breadcrumb메뉴
                $.ajax({url:"common/breadcrumb.txt", dataType:"text", success:function(data){
                    $('#breadcrumb-template').replaceWith(data);
                    breadcrumbMenu();
                }});
            </script>

            <div class="contents">
                <div class="title-main-wrap">
                    <h2 class="title-main">청소년 재정교실</h2>
                    <div class="right">
                        <a href="javascript:void(0);" class="btn-sm btn-white">
                            <span>재정 수업자료 보러가기</span>
                            <i class="ico-arr-r" aria-hidden="true"></i>
                        </a>
                    </div>
                </div>

                <div class="youth-main-body">
                    <div class="info-guide is-summary">
                        <div class="info-guide-head">
                            <i class="ico-info-data" aria-hidden="true"></i>
                            <strong class="info-guide-tit">쉽고 재미있게 즐기는 청소년 재정교실</strong>
                        </div>
                        <div class="info-guide-body">
                            <p>콘텐츠, 동영상, 게임 등 재미있게 배우며, 재정 수업 자료에서 자세한 내용을 살펴볼 수 있습니다.</p>
                        </div>
                    </div>

                    <ul class="link-card-list is-cols-3">
                        <li>
                            <a href="javascript:void(0);" class="link-card is-blue">
                                <div class="link-card-body">
                                    <div class="link-card-head">
                                        <strong class="link-card-tit">재정콘텐츠</strong>
                                        <p class="link-card-desc">웹툰·카드뉴스로 읽는 재정 이야기.<br>어려운 개념도 쉽게 확인해보세요</p>
                                    </div>
                                    <img class="link-card-visual" src="../images/content/link-card-youth-01.png" alt="">
                                </div>
                            </a>
                        </li>
                        <li>
                            <a href="javascript:void(0);" class="link-card is-mint">
                                <div class="link-card-body">
                                    <div class="link-card-head">
                                        <strong class="link-card-tit">재정동영상</strong>
                                        <p class="link-card-desc">영상으로 배우는 재정·경제 이야기<br>영상을 통해 배워보세요</p>
                                    </div>
                                    <img class="link-card-visual" src="../images/content/link-card-youth-02.png" alt="">
                                </div>
                            </a>
                        </li>
                        <li>
                            <a href="javascript:void(0);" class="link-card is-gray">
                                <div class="link-card-body">
                                    <div class="link-card-head">
                                        <strong class="link-card-tit">재정게임</strong>
                                        <p class="link-card-desc">놀면서 배우는 재정 체험<br>퀴즈·시뮬레이션으로 직접 경험해보세요</p>
                                    </div>
                                    <img class="link-card-visual" src="../images/content/link-card-youth-03.png" alt="">
                                </div>
                            </a>
                        </li>
                    </ul>
                </div>

                <script id="feedback-template">
                    // 피드백
                    $.ajax({url:"common/feedback.txt", dataType:"text", success:function(data){
                        $('#feedback-template').replaceWith(data);
                        pageFeedback();
                    }});
                </script>

            </div>
            <!-- //contents -->

            <script id="floating-template">
                // 플로팅메뉴
                $.ajax({url:"common/floating.txt", dataType:"text", success:function(data){
                    $('#floating-template').replaceWith(data);
                }});
            </script>
        </div>
        <script id="footer-template">
            // 푸터
            $.ajax({url:"common/footer.txt", dataType:"text", success:function(data){
                $('#footer-template').replaceWith(data);
            }});
        </script>
    </div>
    <!-- // wrap -->

</body>
</html>
