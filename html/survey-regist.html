<!DOCTYPE html>
<html lang="ko">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="format-detection" content="telephone=no"/>
<title>열린재정</title>

<link type="text/css" rel="stylesheet" href="../js/jquery-ui/jquery-ui.css">
<link type="text/css" rel="stylesheet" href="../js/swiper10.3.1/swiper-bundle.min.css">
<link type="text/css" rel="stylesheet" href="../css/style.css">
<script src="../js/jquery-1.12.4.min.js"></script>
<script src="../js/jquery-ui/jquery-ui.min.js"></script>
<script src="../js/swiper10.3.1/swiper-bundle.min.js"></script>
<script src="../js/pub-ui.js"></script>

</head>
<body>

    <dl class="skipLink">
        <dt>바로가기 메뉴</dt>	
        <dd><a href="#gnbMenu">주메뉴 바로가기</a></dd>
        <dd><a href="#content">본문 바로가기</a></dd>
    </dl>
    <div class="wrap">
        <script id="header-template">
            // 헤더
            $.ajax({url:"common/header.txt", dataType:"text", success:function(data){
                $('#header-template').replaceWith(data);
            }});
        </script>

        <div class="container" id="content">
            <script id="subvisual-template">
                $.ajax({url:"common/subvisual.txt", dataType:"text", success:function(data){
                    $('#subvisual-template').replaceWith($(data).filter('#visual-together'));
                }});
            </script>

            <script id="breadcrumb-template">
                // breadcrumb메뉴
                $.ajax({url:"common/breadcrumb.txt", dataType:"text", success:function(data){
                    $('#breadcrumb-template').replaceWith(data);
                    breadcrumbMenu();
                }});
            </script>
            
            <div class="contents">
                <div class="subject-head">
                    <div class="subject-title">
                        <h3 class="tit">2018년 상반기 사용자 만족도조사</h3>
                    </div>
                    <div class="subject-info">
                        <dl>
                            <dt>설문기간</dt>
                            <dd>2026-07-22~2026-07-31</dd>
                        </dl>
                    </div>
                </div>

                <div class="title-section-wrap">
                    <h3 class="title-section">응답자 정보</h3>
                    <div class="right"><p class="txt-required"><span class="ico-required"><span class="sr-only">(필수)</span></span> 필수 입력 항목입니다.</p></div>
                </div>

                <div class="data-detail regist-form-table">
                    <table>
                        <caption class="sr-only">응답자 정보 입력 — 성별, 연령, 직업, 연락처, 이메일</caption>
                        <colgroup>
                            <col style="width:210px">
                            <col>
                        </colgroup>
                        <tbody>
                            <tr>
                                <th scope="row"><span class="required">귀하의 성별은? <span class="ico-required"><span class="sr-only">(필수)</span></span></span></th>
                                <td>
                                    <div class="input-choice-wrap">
                                        <div class="input-choice"><input type="radio" id="survey-gender-1" name="survey-gender"><label for="survey-gender-1">미기재</label></div>
                                        <div class="input-choice"><input type="radio" id="survey-gender-2" name="survey-gender"><label for="survey-gender-2">남성</label></div>
                                        <div class="input-choice"><input type="radio" id="survey-gender-3" name="survey-gender"><label for="survey-gender-3">여성</label></div>
                                        <div class="input-choice"><input type="radio" id="survey-gender-4" name="survey-gender"><label for="survey-gender-4">성별미상</label></div>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <th scope="row"><span class="required">귀하의 연령은? <span class="ico-required"><span class="sr-only">(필수)</span></span></span></th>
                                <td>
                                    <div class="input-choice-wrap">
                                        <div class="input-choice"><input type="radio" id="survey-age-1" name="survey-age"><label for="survey-age-1">20세 미만</label></div>
                                        <div class="input-choice"><input type="radio" id="survey-age-2" name="survey-age"><label for="survey-age-2">20-29세</label></div>
                                        <div class="input-choice"><input type="radio" id="survey-age-3" name="survey-age"><label for="survey-age-3">30-39세</label></div>
                                        <div class="input-choice"><input type="radio" id="survey-age-4" name="survey-age"><label for="survey-age-4">40-49세</label></div>
                                        <div class="input-choice"><input type="radio" id="survey-age-5" name="survey-age"><label for="survey-age-5">50-59세</label></div>
                                        <div class="input-choice"><input type="radio" id="survey-age-6" name="survey-age"><label for="survey-age-6">60-69세</label></div>
                                        <div class="input-choice"><input type="radio" id="survey-age-7" name="survey-age"><label for="survey-age-7">70세 이상</label></div>
                                    </div>
                                </td>
                            </tr>
                            <tr class="row-multi">
                                <th scope="row"><span class="required">귀하의 직업은? <span class="ico-required"><span class="sr-only">(필수)</span></span></span></th>
                                <td>
                                    <div class="input-choice-wrap">
                                        <div class="input-choice"><input type="radio" id="survey-job-1" name="survey-job"><label for="survey-job-1">국민</label></div>
                                        <div class="input-choice"><input type="radio" id="survey-job-2" name="survey-job"><label for="survey-job-2">공무원(부처, 지자체)</label></div>
                                        <div class="input-choice"><input type="radio" id="survey-job-3" name="survey-job"><label for="survey-job-3">연구원</label></div>
                                        <div class="input-choice"><input type="radio" id="survey-job-4" name="survey-job"><label for="survey-job-4">공공기관 종사자</label></div>
                                        <div class="input-choice"><input type="radio" id="survey-job-5" name="survey-job"><label for="survey-job-5">국회 관계자</label></div>
                                        <div class="input-choice"><input type="radio" id="survey-job-6" name="survey-job"><label for="survey-job-6">교수</label></div>
                                        <div class="input-choice"><input type="radio" id="survey-job-7" name="survey-job"><label for="survey-job-7">전문가(교수, 연구원)</label></div>
                                        <div class="input-choice"><input type="radio" id="survey-job-8" name="survey-job"><label for="survey-job-8">민간기업</label></div>
                                        <div class="input-choice"><input type="radio" id="survey-job-9" name="survey-job"><label for="survey-job-9">개인사업</label></div>
                                        <div class="input-choice"><input type="radio" id="survey-job-10" name="survey-job"><label for="survey-job-10">기타</label></div>
                                        <div class="input-choice"><input type="radio" id="survey-job-11" name="survey-job"><label for="survey-job-11">자영업자</label></div>
                                        <div class="input-choice"><input type="radio" id="survey-job-12" name="survey-job"><label for="survey-job-12">학생</label></div>
                                        <div class="input-choice"><input type="radio" id="survey-job-13" name="survey-job"><label for="survey-job-13">전업주부</label></div>
                                        <div class="input-choice"><input type="radio" id="survey-job-14" name="survey-job"><label for="survey-job-14">군인</label></div>
                                        <div class="input-choice"><input type="radio" id="survey-job-15" name="survey-job"><label for="survey-job-15">농업 또는 어업 또는 임업 등</label></div>
                                        <div class="input-choice"><input type="radio" id="survey-job-16" name="survey-job"><label for="survey-job-16">무직</label></div>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <th scope="row"><span class="required">연락처 <span class="ico-required"><span class="sr-only">(필수)</span></span></span></th>
                                <td>
                                    <div class="input-tel">
                                        <select id="survey-tel-prefix" aria-label="휴대전화 앞자리">
                                            <option value="010" selected>010</option>
                                            <option value="011">011</option>
                                            <option value="016">016</option>
                                            <option value="017">017</option>
                                            <option value="018">018</option>
                                            <option value="019">019</option>
                                        </select>
                                        <input type="text" id="survey-tel-mid" maxlength="4" aria-label="휴대전화 중간 4자리">
                                        <input type="text" id="survey-tel-last" maxlength="4" aria-label="휴대전화 끝 4자리">
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <th scope="row"><span class="required">이메일 <span class="ico-required"><span class="sr-only">(필수)</span></span></span></th>
                                <td>
                                    <div class="input-email">
                                        <input type="text" id="survey-email-id" aria-label="이메일 아이디">
                                        <span class="at">@</span>
                                        <input type="text" id="survey-email-domain" aria-label="이메일 도메인">
                                        <select id="survey-email-select" aria-label="이메일 도메인 선택">
                                            <option value="" selected>직접입력</option>
                                            <option value="naver.com">naver.com</option>
                                            <option value="gmail.com">gmail.com</option>
                                            <option value="daum.net">daum.net</option>
                                        </select>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="privacy-agree">
                    <div class="input-choice">
                        <input type="checkbox" id="privacy-agree">
                        <label for="privacy-agree">개인정보 수집·이용에 동의합니다.<em>(필수)</em></label>
                    </div>
                    <a href="pop-survey-privacy.html" target="_blank" class="btn-link-terms">약관보기</a>
                </div>

                <div class="btn-bottom-wrap">
                    <a href="survey.html" class="btn-nm st-dark">목록</a>
                    <div class="right">
                        <button type="button" class="btn-nm st-blue">설문참여</button>
                    </div>
                </div>

                <script id="feedback-template">
                    // 피드백
                    $.ajax({url:"common/feedback.txt", dataType:"text", success:function(data){
                        $('#feedback-template').replaceWith(data);
                        pageFeedback();
                    }});
                </script>

            </div>
            <!-- //contents -->

            <script id="floating-template">
                // 플로팅메뉴
                $.ajax({url:"common/floating.txt", dataType:"text", success:function(data){
                    $('#floating-template').replaceWith(data);
                }});
            </script>
        </div>
        <script id="footer-template">
            // 푸터
            $.ajax({url:"common/footer.txt", dataType:"text", success:function(data){
                $('#footer-template').replaceWith(data);
            }});
        </script>
    </div>
    <!-- // wrap -->

</body>
</html>
