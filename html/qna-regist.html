<!DOCTYPE html>
<html lang="ko">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="format-detection" content="telephone=no"/>
<title>열린재정</title>


<link type="text/css" rel="stylesheet" href="../css/realgrid/realgrid-white.css">
<link type="text/css" rel="stylesheet" href="../css/realgrid/realgrid-style.css">


<link type="text/css" rel="stylesheet" href="../js/jquery-ui/jquery-ui.css">
<link type="text/css" rel="stylesheet" href="../js/swiper10.3.1/swiper-bundle.min.css">
<link type="text/css" rel="stylesheet" href="../css/style.css">
<script src="../js/jquery-4.0.0.min.js"></script>
<script src="../js/jquery-ui/jquery-ui.min.js"></script>
<script src="../js/swiper10.3.1/swiper-bundle.min.js"></script>
<script src="../js/pub-ui.js"></script>

</head>
<body>

    <dl class="skipLink">
        <dt>바로가기 메뉴</dt>	
        <dd><a href="#gnbMenu">주메뉴 바로가기</a></dd>
        <dd><a href="#content">본문 바로가기</a></dd>
    </dl>
    <div class="wrap">
        <script id="header-template">
            // 헤더
            $.ajax({url:"common/header.txt", dataType:"text", success:function(data){
                $('#header-template').replaceWith(data);
            }});
        </script>

        <div class="container" id="content">
            <script id="subvisual-template">
                $.ajax({url:"common/subvisual.txt", dataType:"text", success:function(data){
                    $('#subvisual-template').replaceWith($(data).filter('#visual-notice'));
                }});
            </script>

            <script id="breadcrumb-template">
                // breadcrumb메뉴
                $.ajax({url:"common/breadcrumb.txt", dataType:"text", success:function(data){
                    $('#breadcrumb-template').replaceWith(data);
                    breadcrumbMenu();
                }});
            </script>
            
            <div class="contents">
                <div class="title-main-wrap">
                    <h2 class="title-main">Q&A</h2>
                </div>

                <div class="giude-box">
                    <h3 class="box-tit">작성 안내 유의사항</h3>
                    <div class="guide-text">
                        <p>1. 비밀글로 설정하지 않을 경우 작성하신 내용에 개인정보(민감정보 포함)가 공개될 수 있습니다. 개인정보(민감정보 포함)가 포함되어 있는 경우 반드시<br>비밀글로 작성하여 체크해주시기 바랍니다.</p>
                        <p class="sub">※ 개인정보(민감정보 포함): 성명, 주민등록번호, 핸드폰번호, 주소, 계좌번호, 건강정보, 장애정보, 인종·민족정보, 사상·신념 등</p>
                        <p>2. 홈페이지에 맞지 않는 내용의 게시물은 임의로 삭제될 수 있습니다.</p>
                    </div>
                </div>

                <form class="write-form">
                    <div class="data-detail qna-form-table">
                        <table>
                            <caption class="sr-only">Q&amp;A 문의 작성</caption>
                            <colgroup>
                                <col style="width:210px">
                                <col>
                            </colgroup>
                            <tbody>
                                <tr>
                                    <th scope="row"><label for="qna-type" class="required">문의유형</label></th>
                                    <td>
                                        <select id="qna-type" aria-label="문의유형" required>
                                            <option value="">문의유형 선택</option>
                                            <option>컨텐츠</option>
                                            <option>오류내용</option>
                                            <option>개선요청</option>
                                            <option>이용문의</option>
                                        </select>
                                    </td>
                            </tr>
                                <tr>
                                    <th scope="row"><label for="qna-title" class="required">제목</label></th>
                                    <td><input type="text" id="qna-title" placeholder="제목을 입력해주세요." required style="width:100%;"></td>
                                </tr>
                                <tr>
                                    <th scope="row">비밀글 여부</th>
                                    <td>
                                        <div class="input-choice">
                                            <input type="checkbox" id="qna-secret">
                                            <label for="qna-secret">비밀글로 설정 <span>(작성자와 담당자만 열람 가능합니다.)</span></label>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <th scope="row"><label for="qna-writer" class="required">작성자</label></th>
                                    <td><input type="text" id="qna-writer" value="홍길동" required></td>
                                </tr>
                                <tr>
                                    <th scope="row"><label for="qna-content" class="required">내용</label></th>
                                    <td>
                                        <textarea id="qna-content" maxlength="400" placeholder="내용을 입력해주세요. (한글 최대 400자 이내 입력 가능합니다.)" required></textarea>
                                        <div class="text-count"><em>0</em><span>/400</span></div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="btn-bottom-wrap">
                        <button type="button" class="btn-nm st-dark">목록</button>
                        <div class="right">
                            <button type="button" class="btn-nm st-blue">등록</button>
                        </div>
                    </div>
                    
                </form>

            </div>
            <!-- //contents -->

            <script id="floating-template">
                // 플로팅메뉴
                $.ajax({url:"common/floating.txt", dataType:"text", success:function(data){
                    $('#floating-template').replaceWith(data);
                }});
            </script>
        </div>
        <script id="footer-template">
            // 푸터
            $.ajax({url:"common/footer.txt", dataType:"text", success:function(data){
                $('#footer-template').replaceWith(data);
            }});
        </script>
    </div>
    <!-- // wrap -->









    <script>
        $('#qna-content').on('input', function(){
            $('.text-count em').text(this.value.length);
        });
    </script>
</body>
</html>
