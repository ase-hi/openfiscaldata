<!DOCTYPE html>
<html lang="ko">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="format-detection" content="telephone=no"/>
<title>열린재정</title>

<link type="text/css" rel="stylesheet" href="../js/jquery-ui/jquery-ui.css">
<link type="text/css" rel="stylesheet" href="../js/swiper10.3.1/swiper-bundle.min.css">
<link type="text/css" rel="stylesheet" href="../css/style.css">
<script src="../js/jquery-1.12.4.min.js"></script>
<script src="../js/jquery-ui/jquery-ui.min.js"></script>
<script src="../js/swiper10.3.1/swiper-bundle.min.js"></script>
<script src="../js/pub-ui.js"></script>

</head>
<body>

    <dl class="skipLink">
        <dt>바로가기 메뉴</dt>
        <dd><a href="#gnbMenu">주메뉴 바로가기</a></dd>
        <dd><a href="#content">본문 바로가기</a></dd>
    </dl>
    <div class="wrap">
        <script id="header-template">
            // 헤더
            $.ajax({url:"common/header.txt", dataType:"text", success:function(data){
                $('#header-template').replaceWith(data);
            }});
        </script>

        <div class="container" id="content">
            <script id="subvisual-template">
                $.ajax({url:"common/subvisual.txt", dataType:"text", success:function(data){
                    $('#subvisual-template').replaceWith($(data).filter('#visual-finance'));
                }});
            </script>

            <script id="breadcrumb-template">
                // breadcrumb메뉴
                $.ajax({url:"common/breadcrumb.txt", dataType:"text", success:function(data){
                    $('#breadcrumb-template').replaceWith(data);
                    breadcrumbMenu();
                }});
            </script>

            <div class="contents">

                <div class="view-detail-wrap">
                    <article class="view-detail">
                        <header class="subject-head">
                            <div class="subject-title">
                                <h3 class="tit">재정 짝 맞추기</h3>
                            </div>
                            <div class="subject-info">
                                <dl>
                                    <dt>등록일</dt>
                                    <dd>2026-07-01</dd>
                                </dl>
                                <dl>
                                    <dt>조회</dt>
                                    <dd>29</dd>
                                </dl>
                            </div>
                        </header>

                        <div class="view-detail-body is-game">
                            <div class="game-intro">
                                <div class="game-intro-preview">
                                    <div class="game-intro-inner">
                                        <div class="game-intro-visual">
                                            <div class="game-intro-thumb">
                                                <img src="../images/temp/finance-more-01.png" alt="">
                                                <span class="card-tag st-red">재정퀴즈</span>
                                            </div>
                                            <div class="game-intro-info">
                                                <ul class="game-intro-meta">
                                                    <li>
                                                        <span class="label"><i class="ico-game-time" aria-hidden="true"></i> 소요시간</span>
                                                        <span class="value">약 1~3분</span>
                                                    </li>
                                                    <li>
                                                        <span class="label"><i class="ico-game-stage" aria-hidden="true"></i> 난이도</span>
                                                        <span class="value">3단계</span>
                                                    </li>
                                                </ul>
                                                <p class="game-intro-topic">
                                                    <span class="label"><i class="ico-game-topic" aria-hidden="true"></i> 재정주제</span>
                                                    <span class="value">재정 제도, 예산결산 운용절차</span>
                                                </p>
                                            </div>
                                        </div>
                                        <button type="button" class="play-card-btn game-intro-start">
                                            <i class="ico-play-card" aria-hidden="true"></i>
                                            <span>게임 시작</span>
                                        </button>
                                    </div>
                                </div>
                                <div class="game-intro-guide">
                                    <div class="game-intro-head">
                                        <i class="ico-game-guide" aria-hidden="true"></i>
                                        <h4 class="game-intro-tit"><em>재정 짝맞추기</em> 게임방법</h4>
                                    </div>
                                    <ol class="step-list">
                                        <li>재정 카드를 뒤집습니다.</li>
                                        <li>같은 아이콘끼리 짝을 맞춥니다.</li>
                                        <li>맞출때마다 용어 뜻풀이가 나오면 점수를 얻습니다.</li>
                                        <li>모두 맞추면 성공! 점수, 시간, 콤보가 기록됩니다.</li>
                                    </ol>
                                </div>
                            </div>
                        </div>
                    </article>
                </div>

                <div class="btn-bottom-wrap">
                    <a href="finance-youth-game.html" class="btn-nm st-dark">목록</a>
                </div>

                <script id="feedback-template">
                    // 피드백
                    $.ajax({url:"common/feedback.txt", dataType:"text", success:function(data){
                        $('#feedback-template').replaceWith(data);
                        pageFeedback();
                    }});
                </script>

            </div>
            <!-- //contents -->

            <script id="floating-template">
                // 플로팅메뉴
                $.ajax({url:"common/floating.txt", dataType:"text", success:function(data){
                    $('#floating-template').replaceWith(data);
                }});
            </script>
        </div>
        <script id="footer-template">
            // 푸터
            $.ajax({url:"common/footer.txt", dataType:"text", success:function(data){
                $('#footer-template').replaceWith(data);
            }});
        </script>
    </div>
    <!-- // wrap -->

</body>
</html>
