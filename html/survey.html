<!DOCTYPE html>
<html lang="ko">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="format-detection" content="telephone=no"/>
<title>열린재정</title>

<link type="text/css" rel="stylesheet" href="../js/jquery-ui/jquery-ui.css">
<link type="text/css" rel="stylesheet" href="../js/swiper10.3.1/swiper-bundle.min.css">
<link type="text/css" rel="stylesheet" href="../css/style.css">
<script src="../js/jquery-1.12.4.min.js"></script>
<script src="../js/jquery-ui/jquery-ui.min.js"></script>
<script src="../js/swiper10.3.1/swiper-bundle.min.js"></script>
<script src="../js/pub-ui.js"></script>

</head>
<body>

    <dl class="skipLink">
        <dt>바로가기 메뉴</dt>	
        <dd><a href="#gnbMenu">주메뉴 바로가기</a></dd>
        <dd><a href="#content">본문 바로가기</a></dd>
    </dl>
    <div class="wrap">
        <script id="header-template">
            // 헤더
            $.ajax({url:"common/header.txt", dataType:"text", success:function(data){
                $('#header-template').replaceWith(data);
            }});
        </script>

        <div class="container" id="content">
            <script id="subvisual-template">
                $.ajax({url:"common/subvisual.txt", dataType:"text", success:function(data){
                    $('#subvisual-template').replaceWith($(data).filter('#visual-together'));
                }});
            </script>

            <script id="breadcrumb-template">
                // breadcrumb메뉴
                $.ajax({url:"common/breadcrumb.txt", dataType:"text", success:function(data){
                    $('#breadcrumb-template').replaceWith(data);
                    breadcrumbMenu();
                }});
            </script>
            
            <div class="contents">
                <div class="subject-head">
                    <div class="subject-title">
                        <h3 class="tit">2018년 상반기 사용자 만족도조사</h3>
                    </div>
                    <div class="subject-info">
                        <dl>
                            <dt>설문기간</dt>
                            <dd>2026-07-22~2026-07-31</dd>
                        </dl>
                    </div>
                </div>

                <div class="title-section-wrap">
                    <h3 class="title-section">설문</h3>
                </div>

                <div class="survey-form">
                    <div class="survey-group">
                        <h4 class="survey-group-tit">그룹1</h4>
                        <div class="survey-item">
                            <p class="survey-q">1. 문항 1</p>
                            <div class="input-choice-wrap">
                                <div class="input-choice"><input type="radio" id="survey-q1-1" name="survey-q1"><label for="survey-q1-1">매우 만족한다</label></div>
                                <div class="input-choice"><input type="radio" id="survey-q1-2" name="survey-q1"><label for="survey-q1-2">어느정도 만족한다</label></div>
                                <div class="input-choice"><input type="radio" id="survey-q1-3" name="survey-q1"><label for="survey-q1-3">보통이다</label></div>
                                <div class="input-choice"><input type="radio" id="survey-q1-4" name="survey-q1"><label for="survey-q1-4">별로 만족스럽지 않다</label></div>
                                <div class="input-choice"><input type="radio" id="survey-q1-5" name="survey-q1"><label for="survey-q1-5">매우 만족스럽지 않다</label></div>
                            </div>
                        </div>
                    </div>

                    <div class="survey-group">
                        <h4 class="survey-group-tit">그룹2</h4>
                        <div class="survey-item">
                            <p class="survey-q">2. 문항 2</p>
                            <div class="input-choice-wrap st-col">
                                <div class="input-choice"><input type="checkbox" id="survey-q2-1" name="survey-q2"><label for="survey-q2-1">매우 만족한다</label></div>
                                <div class="input-choice"><input type="checkbox" id="survey-q2-2" name="survey-q2"><label for="survey-q2-2">어느정도 만족한다</label></div>
                                <div class="input-choice"><input type="checkbox" id="survey-q2-3" name="survey-q2"><label for="survey-q2-3">보통이다</label></div>
                                <div class="input-choice"><input type="checkbox" id="survey-q2-4" name="survey-q2"><label for="survey-q2-4">별로 만족스럽지 않다</label></div>
                                <div class="input-choice"><input type="checkbox" id="survey-q2-5" name="survey-q2"><label for="survey-q2-5">매우 만족스럽지 않다</label></div>
                            </div>
                        </div>
                    </div>

                    <div class="survey-group">
                        <h4 class="survey-group-tit">그룹3</h4>
                        <div class="survey-item">
                            <p class="survey-q">3. 문항 3</p>
                            <textarea id="survey-q3" placeholder=""></textarea>
                        </div>
                    </div>
                </div>

                <div class="btn-bottom-wrap">
                    <a href="survey.html" class="btn-nm st-dark">목록</a>
                    <div class="right">
                        <button type="button" class="btn-nm st-blue">제출하기</button>
                    </div>
                </div>

                <script id="feedback-template">
                    // 피드백
                    $.ajax({url:"common/feedback.txt", dataType:"text", success:function(data){
                        $('#feedback-template').replaceWith(data);
                        pageFeedback();
                    }});
                </script>

            </div>
            <!-- //contents -->

            <script id="floating-template">
                // 플로팅메뉴
                $.ajax({url:"common/floating.txt", dataType:"text", success:function(data){
                    $('#floating-template').replaceWith(data);
                }});
            </script>
        </div>
        <script id="footer-template">
            // 푸터
            $.ajax({url:"common/footer.txt", dataType:"text", success:function(data){
                $('#footer-template').replaceWith(data);
            }});
        </script>
    </div>
    <!-- // wrap -->

</body>
</html>
